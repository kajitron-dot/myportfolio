<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z-Works | 指示受けの教科書 & AIシミュレーター</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, onSnapshot, query, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Firebase & Global Config
        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'z-works-memo-app';
        const apiKey = ""; // Runtime environment provides the key

        window.state = {
            user: null,
            memos: [],
            isAnalyzing: false
        };

        // Auth initialization
        const initAuth = async () => {
            try {
                // RULE 3: Auth Before Queries - Check for initial auth token
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (error) {
                console.error("Auth error:", error);
                // Fallback to anonymous if custom token fails
                try {
                    await signInAnonymously(auth);
                } catch (e) {
                    console.error("Anonymous auth fallback failed:", e);
                }
            }
        };
        initAuth();

        onAuthStateChanged(auth, (user) => {
            window.state.user = user;
            if (user) {
                document.getElementById('user-id-display').innerText = `User: ${user.uid.substring(0, 8)}...`;
                loadMemos(user.uid);
            }
        });

        // AI Simulator Logic
        window.analyzeInstruction = async () => {
            const input = document.getElementById('ai-input');
            const instruction = input.value.trim();
            if (!instruction || window.state.isAnalyzing) return;

            window.state.isAnalyzing = true;
            const btn = document.getElementById('analyze-btn');
            const resultArea = document.getElementById('ai-result');
            
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i>分析中...';
            resultArea.classList.remove('hidden');
            resultArea.innerHTML = '<p class="text-sm text-slate-500 animate-pulse">AIが指示の解像度を分析しています...</p>';

            const systemPrompt = `
                あなたは若手社員のメンターAIです。上司からの指示を受け取り、以下の項目で分析してください。
                1. 指示の解像度（0-100%）
                2. 不足している情報（期限、目的、クオリティ、背景など）
                3. 上司への最適な聞き返しフレーズ
                返信は親しみやすい日本語で、箇条書きを活用してください。
            `;

            try {
                let responseText = "";
                let retries = 0;
                const maxRetries = 5;
                
                const callApi = async () => {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: `上司からの指示: "${instruction}"` }] }],
                            systemInstruction: { parts: [{ text: systemPrompt }] }
                        })
                    });
                    if (!response.ok) throw new Error('API Error');
                    const result = await response.json();
                    return result.candidates?.[0]?.content?.parts?.[0]?.text;
                };

                // Exponential backoff
                while (retries < maxRetries) {
                    try {
                        responseText = await callApi();
                        break;
                    } catch (e) {
                        retries++;
                        await new Promise(r => setTimeout(r, Math.pow(2, retries) * 1000));
                    }
                }

                if (!responseText) throw new Error("Failed to get response");

                resultArea.innerHTML = `
                    <div class="bg-blue-50 p-4 rounded-2xl border border-blue-100">
                        <div class="prose prose-sm text-slate-700">
                            ${responseText.replace(/\n/g, '<br>')}
                        </div>
                        <button onclick="copyToMemo('${instruction.replace(/'/g, "\\'")}')" class="mt-4 text-xs font-bold text-blue-600 flex items-center">
                            <i class="fa-solid fa-copy mr-1"></i> この分析内容をメモに残す
                        </button>
                    </div>
                `;
            } catch (error) {
                resultArea.innerHTML = '<p class="text-sm text-red-500">分析に失敗しました。もう一度お試しください。</p>';
            } finally {
                window.state.isAnalyzing = false;
                btn.innerHTML = '<i class="fa-solid fa-wand-magic-sparkles mr-2"></i>AIでシミュレーションする';
            }
        };

        window.copyToMemo = async (content) => {
            const input = document.getElementById('general-memo');
            input.value = `【AI分析結果】\n${content}`;
            showScene('mypage');
        };

        // Standard Memo Logic
        const loadMemos = (userId) => {
            // RULE 1: Strict Paths
            const memoRef = collection(db, 'artifacts', appId, 'users', userId, 'memos');
            // RULE 2: No Complex Queries (filter in JS)
            onSnapshot(memoRef, (snapshot) => {
                const memos = [];
                snapshot.forEach((doc) => memos.push({ id: doc.id, ...doc.data() }));
                window.state.memos = memos.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
                renderMemos();
            }, (error) => console.error("Firestore error:", error));
        };

        window.saveMemo = async (sceneTitle) => {
            if (!window.state.user) return;
            const inputId = sceneTitle === 'マイページ' ? 'general-memo' : `memo-input-${sceneTitle}`;
            const input = document.getElementById(inputId);
            const content = input.value.trim();
            if (!content) return;

            try {
                const memoRef = collection(db, 'artifacts', appId, 'users', window.state.user.uid, 'memos');
                await addDoc(memoRef, {
                    scene: sceneTitle,
                    content: content,
                    createdAt: serverTimestamp()
                });
                input.value = '';
                if(sceneTitle !== 'マイページ') showScene('mypage');
            } catch (error) { console.error("Save error:", error); }
        };

        function renderMemos() {
            const container = document.getElementById('memo-list');
            if (!container) return;
            if (window.state.memos.length === 0) {
                container.innerHTML = '<p class="text-center text-slate-400 py-8">保存されたメモはありません</p>';
                return;
            }
            container.innerHTML = window.state.memos.map(memo => `
                <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 mb-3">
                    <div class="flex justify-between items-start mb-2">
                        <span class="text-[10px] font-bold px-2 py-1 bg-slate-100 rounded-full text-slate-500">${memo.scene}</span>
                        <span class="text-[10px] text-slate-400">${memo.createdAt ? new Date(memo.createdAt.seconds * 1000).toLocaleString() : '保存中...'}</span>
                    </div>
                    <p class="text-sm leading-relaxed text-slate-700">${memo.content.replace(/\n/g, '<br>')}</p>
                </div>
            `).join('');
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap');
        body { font-family: 'Noto Sans JP', sans-serif; background-color: #f8fafc; }
        .scene-card { display: none; }
        .scene-card.active { display: block; animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .tab-active { border-bottom: 3px solid #3b82f6; color: #3b82f6; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="text-slate-800 pb-28">

    <!-- Header -->
    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
            <h1 class="text-xl font-bold text-blue-600 flex items-center">
                <i class="fa-solid fa-lightbulb mr-2 text-yellow-400"></i>Z-Works
            </h1>
            <div id="user-id-display" class="text-[10px] text-slate-400 bg-slate-50 px-2 py-1 rounded">Connecting...</div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-4xl mx-auto p-4">
        
        <!-- Tabs -->
        <div class="flex overflow-x-auto border-b border-slate-200 mb-6 no-scrollbar sticky top-16 bg-white/90 backdrop-blur-md z-40">
            <button onclick="showScene('ai')" id="tabai" class="tab-btn flex-shrink-0 px-5 py-3 text-sm font-bold tab-active">
                <i class="fa-solid fa-robot mr-1"></i>AI模擬
            </button>
            <button onclick="showScene(1)" id="tab1" class="tab-btn flex-shrink-0 px-5 py-3 text-sm font-bold text-slate-500">
                1. 曖昧指示
            </button>
            <button onclick="showScene(2)" id="tab2" class="tab-btn flex-shrink-0 px-5 py-3 text-sm font-bold text-slate-500">
                2. 優先順位
            </button>
            <button onclick="showScene('mypage')" id="tabmypage" class="tab-btn flex-shrink-0 px-5 py-3 text-sm font-bold text-slate-500 text-blue-600">
                <i class="fa-solid fa-folder-open mr-1"></i>マイメモ
            </button>
        </div>

        <!-- AI Simulator Card -->
        <div id="sceneai" class="scene-card active">
            <div class="bg-gradient-to-br from-blue-600 to-indigo-700 rounded-3xl shadow-xl overflow-hidden mb-6 p-6 text-white">
                <h3 class="text-xl font-bold mb-2 flex items-center">
                    <i class="fa-solid fa-brain mr-2"></i>指示受けシミュレーター
                </h3>
                <p class="text-sm opacity-90 mb-6">上司からの指示を入力すると、AIが「聞き返すべきポイント」をアドバイスします。</p>
                
                <div class="bg-white/10 backdrop-blur-sm rounded-2xl p-4 mb-4">
                    <textarea id="ai-input" rows="3" placeholder="例: 「あの件、いい感じに資料まとめといて。来週の会議で使うから。」" class="w-full bg-transparent border-none text-white placeholder-white/50 focus:ring-0 text-sm"></textarea>
                </div>
                
                <button id="analyze-btn" onclick="analyzeInstruction()" class="w-full bg-white text-indigo-700 py-3 rounded-xl font-black text-sm shadow-lg hover:bg-indigo-50 transition active:scale-95">
                    <i class="fa-solid fa-wand-magic-sparkles mr-2"></i>AIでシミュレーションする
                </button>
            </div>

            <div id="ai-result" class="hidden bg-white rounded-3xl shadow-md p-6 mb-6">
                <!-- AI Result Injected Here -->
            </div>
        </div>

        <!-- Scene Cards (Original Manuals) -->
        <div id="scene1" class="scene-card">
            <div class="bg-white rounded-3xl shadow-xl overflow-hidden mb-6">
                <div class="bg-yellow-400 p-4 text-center">
                    <span class="text-xs font-black uppercase text-yellow-900">Scenario 01</span>
                    <h3 class="text-xl font-bold text-yellow-900">「いい感じにまとめといて」</h3>
                </div>
                <div class="p-6">
                    <div class="bg-slate-50 p-6 rounded-3xl mb-6 flex justify-around text-center">
                        <div><i class="fa-solid fa-user-check text-blue-500 mb-1"></i><p class="text-[10px] font-bold">誰に？</p></div>
                        <div><i class="fa-solid fa-bullseye text-blue-500 mb-1"></i><p class="text-[10px] font-bold">何のため？</p></div>
                        <div><i class="fa-solid fa-file-lines text-blue-500 mb-1"></i><p class="text-[10px] font-bold">分量は？</p></div>
                    </div>
                    <div class="bg-blue-600 text-white p-4 rounded-2xl mb-6">
                        <p class="text-xs font-bold opacity-80 mb-1">魔法のフレーズ</p>
                        <p class="text-md font-bold leading-tight">「方向性を合わせたいので、本日中に構成案だけお送りしてよろしいですか？」</p>
                    </div>
                    <div class="mt-4 p-4 border-t border-slate-100">
                        <label class="block text-xs font-bold text-slate-500 mb-2">指示内容を即メモする</label>
                        <div class="flex gap-2">
                            <input type="text" id="memo-input-曖昧な指示" placeholder="例: A部長へのプレゼン、火曜まで" class="flex-1 bg-slate-50 border-none rounded-xl px-4 py-2 text-sm focus:ring-2 focus:ring-blue-500">
                            <button onclick="saveMemo('曖昧な指示')" class="bg-blue-600 text-white px-4 py-2 rounded-xl text-sm font-bold shadow-md"><i class="fa-solid fa-paper-plane"></i></button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div id="scene2" class="scene-card">
            <div class="bg-white rounded-3xl shadow-xl overflow-hidden mb-6">
                <div class="bg-blue-400 p-4 text-center">
                    <span class="text-xs font-black uppercase text-blue-900">Scenario 02</span>
                    <h3 class="text-xl font-bold text-blue-900">優先順位に迷った時</h3>
                </div>
                <div class="p-6">
                    <div class="bg-slate-50 p-6 rounded-3xl mb-6 text-center">
                        <i class="fa-solid fa-code-merge text-3xl text-blue-500 mb-2"></i>
                        <p class="text-sm font-bold">「自分の予測」をセットで伝える</p>
                    </div>
                    <div class="bg-blue-600 text-white p-4 rounded-2xl mb-6">
                        <p class="text-xs font-bold opacity-80 mb-1">魔法のフレーズ</p>
                        <p class="text-md font-bold leading-tight">「Bを優先する場合、Aの納期を明日に調整してもよろしいでしょうか？」</p>
                    </div>
                    <div class="mt-4 p-4 border-t border-slate-100">
                        <label class="block text-xs font-bold text-slate-500 mb-2">指示内容を即メモする</label>
                        <div class="flex gap-2">
                            <input type="text" id="memo-input-優先順位" placeholder="例: 既存Aと新規Bのバッティング" class="flex-1 bg-slate-50 border-none rounded-xl px-4 py-2 text-sm focus:ring-2 focus:ring-blue-500">
                            <button onclick="saveMemo('優先順位')" class="bg-blue-600 text-white px-4 py-2 rounded-xl text-sm font-bold shadow-md"><i class="fa-solid fa-paper-plane"></i></button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- MY PAGE -->
        <div id="scenemypage" class="scene-card">
            <div class="mb-6">
                <h3 class="text-xl font-bold mb-4 flex items-center">
                    <i class="fa-solid fa-memo-circle-check text-blue-600 mr-2"></i>あなたのメモ一覧
                </h3>
                <div class="bg-white p-4 rounded-2xl shadow-sm mb-6 border border-slate-100">
                    <textarea id="general-memo" rows="2" placeholder="自由なメモを残す..." class="w-full bg-slate-50 border-none rounded-xl px-4 py-2 text-sm mb-2 focus:ring-2 focus:ring-blue-500"></textarea>
                    <button onclick="saveMemo('マイページ')" class="w-full bg-blue-600 text-white py-2 rounded-xl text-sm font-bold shadow-md active:scale-95 transition">保存する</button>
                </div>
                <div id="memo-list" class="space-y-4">
                    <!-- Memos injected by JS -->
                </div>
            </div>
        </div>

    </main>

    <!-- Floating Navigation -->
    <div class="fixed bottom-6 left-1/2 -translate-x-1/2 w-[90%] max-w-md bg-slate-900/95 backdrop-blur-md text-white py-3 px-6 rounded-full shadow-2xl flex justify-around items-center z-50">
        <button onclick="showScene('ai')" class="text-center opacity-70 hover:opacity-100 transition">
            <i class="fa-solid fa-robot text-lg"></i>
            <p class="text-[8px] mt-1">AIシミュ</p>
        </button>
        <div class="h-6 w-[1px] bg-slate-700"></div>
        <button onclick="showScene(1)" class="text-center opacity-70 hover:opacity-100 transition">
            <i class="fa-solid fa-book text-lg"></i>
            <p class="text-[8px] mt-1">基本マニュアル</p>
        </button>
        <div class="h-6 w-[1px] bg-slate-700"></div>
        <button onclick="showScene('mypage')" class="text-center opacity-70 hover:opacity-100 transition relative">
            <i class="fa-solid fa-folder-open text-lg"></i>
            <p class="text-[8px] mt-1">マイメモ</p>
        </button>
    </div>

    <script>
        function showScene(id) {
            document.querySelectorAll('.scene-card').forEach(card => card.classList.remove('active'));
            const target = document.getElementById('scene' + id);
            if(target) target.classList.add('active');

            document.querySelectorAll('.tab-btn').forEach(tab => {
                tab.classList.remove('tab-active');
                tab.classList.add('text-slate-500');
            });
            const activeTab = document.getElementById('tab' + id);
            if(activeTab) {
                activeTab.classList.add('tab-active');
                activeTab.classList.remove('text-slate-500');
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>
</html>
